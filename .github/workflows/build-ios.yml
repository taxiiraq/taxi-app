name: Build iOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Setup Environment Variables
      run: |
        echo "EXPO_PUBLIC_SUPABASE_URL=https://weqqelaqsypnevypsdxq.supabase.co" >> $GITHUB_ENV
        echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlcXFlbGFxc3lwbmV2eXBzZHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM4NzQ2OTgsImV4cCI6MjA2OTQ1MDY5OH0.hIgwJcLiNeKd9WOyJdhFfrgYfVDlT2vuV7PM9cEydk0" >> $GITHUB_ENV
        
    - name: Install dependencies
      run: npm install
      
    - name: Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        token: ${{ secrets.EXPO_TOKEN }}
        eas-version: latest
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        
    - name: Build iOS
      run: |
        npx eas build --platform ios --non-interactive --local
      env:
        EXPO_PUBLIC_SUPABASE_URL: ${{ env.EXPO_PUBLIC_SUPABASE_URL }}
        EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ env.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      
    - name: Upload iOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: taxi-app-ios
        path: |
          *.ipa
        retention-days: 30
        
    - name: Create iOS Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          *.ipa
        tag_name: ios-v${{ github.run_number }}
        name: iOS Release v${{ github.run_number }}
        body: |
          ## Taxi App iOS
          
          ### Changes in this release:
          - Automated iOS build from main branch
          - IPA file included
          
          ### Installation:
          1. Download the IPA file
          2. Install via Xcode or TestFlight
          
          ### Testing:
          - Test all customer features
          - Test all driver features  
          - Test admin panel
          - Test support system
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 